<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7ff">
  <title>Ż czy RZ? – Trening ortografii</title>
  <style>
    :root{font-family:ui-rounded,'Segoe UI',system-ui,sans-serif;color:#24304f;background:#f5f7ff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 0%,#dfe6ff 0,transparent 37%),radial-gradient(circle at 100% 95%,#ffe9d2 0,transparent 37%),#f6f7fc}
    button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .shell{max-width:760px;margin:0 auto;padding:28px 22px 60px}
    .heading{text-align:center;margin:16px 0 30px}
    .eyebrow{font-size:13px;font-weight:850;letter-spacing:2px;color:#626bc0;text-transform:uppercase}
    h1{font-size:clamp(40px,8vw,63px);line-height:1.06;letter-spacing:-2px;margin:10px 0 9px;font-weight:900}
    .heading p{color:#68738e;margin:0;font-size:16px}
    .board{background:#fff;border:1px solid #e6e9f5;border-radius:30px;padding:28px;box-shadow:0 18px 55px #37447513}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .roundlabel{font-weight:850;color:#47516f;font-size:15px}
    .stats{display:flex;gap:8px;flex-wrap:wrap}
    .stat{border-radius:100px;padding:7px 12px;font-size:14px;font-weight:800;background:#f0f4ff;color:#4053ab}
    .streak{background:#fff4e7;color:#ab6014}
    .progress{margin-top:17px;height:11px;background:#edf0f7;border-radius:100px;overflow:hidden}
    .progress-fill{height:100%;background:#6a78e5;border-radius:100px;width:0;transition:width .35s ease}
    .question{text-align:center;padding:51px 0 34px}
    .prompt{font-weight:750;font-size:17px;color:#72809b;margin-bottom:17px}
    .word{font-weight:900;letter-spacing:1px;font-size:clamp(38px,8vw,69px);min-height:85px;overflow-wrap:anywhere;line-height:1.25;color:#202b4e}
    .blank{display:inline-block;min-width:1.45em;border-bottom:6px solid #9ca8ee;color:#6675d5;line-height:1.05;padding:0 .08em .05em;border-radius:2px}
    .word.done{color:#3a496b}
    .feedback{min-height:68px;display:grid;place-items:center;padding:10px 5px;text-align:center;font-size:20px;line-height:1.4;font-weight:850}
    .feedback.correct{color:#14855f}
    .feedback.wrong{color:#b85032}
    .choices{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:12px}
    .choice{border:0;border-radius:22px;min-height:116px;padding:20px 8px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.12);transition:transform .1s,filter .15s}
    .choice:hover:not(:disabled){filter:brightness(1.05)}
    .choice:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #0002}
    .choice:disabled{cursor:default;opacity:.46}
    .choice.z{background:#6b61d9}
    .choice.rz{background:#ea8a45}
    .choice .letter{display:block;font-size:39px;font-weight:950;line-height:1}
    .choice .key{display:block;font-size:13px;font-weight:700;opacity:.88;margin-top:9px}
    .next,.restart{display:block;width:100%;min-height:56px;border:0;border-radius:17px;background:#29365e;color:#fff;font-size:18px;font-weight:850;margin-top:16px}
    .next:hover,.restart:hover{background:#394c7d}
    .hidden{display:none!important}
    .hint{text-align:center;color:#77829e;font-size:13px;margin:24px 0 0}
    .end{text-align:center;padding:38px 6px 15px}
    .end .trophy{font-size:60px;line-height:1.1}
    .end h2{font-size:30px;margin:15px 0 7px}
    .end .result{font-size:65px;letter-spacing:-2px;font-weight:950;color:#555bcc;margin:18px 0 4px}
    .end p{color:#68738e;font-size:17px;line-height:1.5}
    .explain{text-align:center;font-size:14px;color:#77829e;margin:18px 0 0}
    button:focus-visible{outline:4px solid #1d2a50;outline-offset:4px}
    @media(max-width:520px){.shell{padding:20px 13px 35px}.heading{margin-bottom:22px}.board{padding:21px 17px;border-radius:24px}.question{padding:40px 0 19px}.choices{gap:10px}.choice{min-height:105px}.feedback{font-size:17px}.word{font-size:clamp(36px,9vw,58px)}.heading p{font-size:14px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="heading">
      <div class="eyebrow">Ortografia · klasa 2</div>
      <h1>Ż czy RZ? <span aria-hidden="true">✏️</span></h1>
      <p>Wybierz brakującą literę. Każda runda ma 10 słów.</p>
    </header>
    <section class="board" aria-label="Gra ortograficzna">
      <div id="game">
        <div class="topline">
          <div class="roundlabel" id="counter">Słowo 1 z 10</div>
          <div class="stats">
            <span class="stat" id="score">✓ 0 poprawnych</span>
            <span class="stat streak" id="streak">🔥 Seria: 0</span>
          </div>
        </div>
        <div class="progress" role="progressbar" aria-label="Postęp rundy" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0" id="progress"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="question">
          <div class="prompt">Czego brakuje?</div>
          <div class="word" id="word" aria-live="polite"></div>
        </div>
        <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
        <div class="choices" id="choices">
          <button type="button" id="choose-z" class="choice z" aria-label="Wstaw ż, strzałka w lewo"><span class="letter">Ż</span><span class="key">← strzałka w lewo</span></button>
          <button type="button" id="choose-rz" class="choice rz" aria-label="Wstaw rz, strzałka w prawo"><span class="letter">RZ</span><span class="key">strzałka w prawo →</span></button>
        </div>
        <button type="button" class="next hidden" id="next">Następne słowo →</button>
        <p class="hint">Możesz używać klawiszy ← i → albo naciskać przyciski.</p>
      </div>
      <div id="end" class="end hidden" aria-live="polite">
        <div class="trophy" id="trophy" aria-hidden="true">🏆</div>
        <h2 id="end-title">Koniec rundy!</h2>
        <div class="result" id="final-score">0/10</div>
        <p id="end-message"></p>
        <button type="button" class="restart" id="restart">Zagraj jeszcze raz ↻</button>
        <p class="explain">W kolejnej rundzie pojawią się inne słowa.</p>
      </div>
    </section>
  </main>
  <script>
    (() => {
      'use strict';

const words = {

  "ż": `
    żaba żabia żabka żuk żuki żółw żółwie żółty żółta żółte
    żubr żubry żyrafa żyrafy żagiel żagle żarówka żarówki żelazko żelazo
    żart żarty żartować żona żony żyto żurek żaden żadna żądło
    żmija żmije żniwa żółtko żółtka żuraw żurawie żegnać żegnaj żeton
    żetony jeż jeże jeżyk jeżyki jeżyna jeżyny wąż węże ryż
    łyżka łyżki łyżeczka łyżeczki nożyczki róża róże różowy różowa różowe
    różnica wieża wieże wieżyczka plaża plaże kałuża kałuże książka książki
    książę księżyc księżniczka śnieżka śnieżki leżak leżaki leżeć leży leżał
    koleżanka koleżanki duży duża duże dużo odważny odważna odważnie strażak
    strażacy straż strażnica garaż garaże bagaż bagaże bagażnik podróż podróże
    podróżnik dróżka mrożony mrożone ważny ważna ważne uważać uważaj uważny
    uważnie każdy każda każde pokaż pokażę pokażesz ważka ważki łyżwa
    łyżwy świeży świeża świeże młodzież mąż mężowie drużyna drużyny pożar
    pożary piżama piżamy ciężki ciężka ciężkie ciężar żłobek żłobki obrażony
    obrażona ostrożny ostrożna ostrożnie niżej wyżej żywy żywa żywe życie
    żyje żyją życzyć życzenia pieniążek pieniążki pożyczyć pożyczka używać używa
    użycie użytek
  `.trim().split(/\s+/),

  "rz": `
    rzeka rzeki rzecz rzeczy rzeczka rzeczki rzepa rzepka rzodkiewka rzodkiewki
    rzęsa rzęsy rzut rzuty rzucać rzuca rzucić rzucił rząd rzadki
    rzadko rześki grzyb grzyby grzybek grzybki grzebień grzmot grzmi grzać
    grzejnik grzeje grzeczny grzeczna grzecznie grządka grządki krzesło krzesła krzak
    krzaki krzew krzewy krzyk krzyczy krzyczeć krzywy krzywa krzywe krzywda
    krzywdzić drzewo drzewa drzewko drzewka drzwi drzemka drzemie drzazga drzazgi
    brzoza brzozy brzeg brzegi brzuch brzuszek brzydki brzydka brzydko brzmieć
    brzmi brzęczy trzy trzeci trzecia trzecie trzeba trzmiel trzmiele trzaska
    trzask trzyma trzymać trzymaj trzepak trzepie przygoda przygody przyroda przyjaciel
    przyjaciółka przyjaźń przyjemny przyjemna przyjemnie przysmak przyszłość przyszły przytulać przytula
    przynosi przynieść przybiega przybiec przyjęcie przyjazd przyjść przystanek przystanki przyprawa
    przyprawy przerwa przerwy przedszkole przedszkolak przed przedmiot przedmioty przepis przepisy
    przebrać przebranie przebiega przeciąg przechodzi przechodzić przeczytać przeczyta przepraszam przeprosiny
    przeziębienie orzech orzechy orzeł marzec kurz kurzu talerz talerze lekarz
    lekarze malarz malarze zwierzę zwierzęta zwierzaki warzywa warzywny warzywniak parzyć
    parzy oparzenie korzeń korzenie korzonki pierze pierzyna dworzec burza burze
    burzowy chrząszcz marzenie marzenia marzyć podwórze porządek porządki porządny porządnie
    porzeczka porzeczki poprzeczka pokrzywa przód rzeźba
  `.trim().split(/\s+/)

};

      const el = (id) => document.getElementById(id);
      const used = {'ż':new Set(),'rz':new Set()};
      let round = [], index = 0, score = 0, streak = 0, bestStreak = 0, answered = false;
      const shuffle = (a) => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a; };
      function draw(type, n){
        let available = words[type].filter(w=>!used[type].has(w));
        if(available.length<n){used[type].clear(); available = [...words[type]];}
        const chosen = shuffle(available).slice(0,n);
        chosen.forEach(w=>used[type].add(w));
        return chosen.map(word=>({word,type}));
      }
      function start(){
        round = shuffle([...draw('ż',5),...draw('rz',5)]);
        index=0;score=0;streak=0;bestStreak=0;answered=false;
        el('game').classList.remove('hidden');el('end').classList.add('hidden');show();
      }
      function show(){
        const q = round[index]; answered=false;
        const position = q.word.indexOf(q.type);
        if(position===-1)throw new Error('Błąd w zestawie słów');
        const gap=document.createElement('span');gap.className='blank';gap.textContent=' ';
        const word=el('word');word.classList.remove('done');word.replaceChildren(document.createTextNode(q.word.slice(0,position)),gap,document.createTextNode(q.word.slice(position+q.type.length)));
        el('counter').textContent=`Słowo ${index+1} z ${round.length}`;
        el('score').textContent=`✓ ${score} poprawnych`;
        el('streak').textContent=`🔥 Seria: ${streak}`;
        el('progress').setAttribute('aria-valuenow',index);
        el('progress-fill').style.width=`${index/round.length*100}%`;
        el('feedback').textContent='';el('feedback').className='feedback';
        el('choose-z').disabled=false;el('choose-rz').disabled=false;
        el('next').classList.add('hidden');el('choices').classList.remove('hidden');
      }
      function choose(type){
        if(answered||el('game').classList.contains('hidden'))return;
        answered=true;const q=round[index];const correct=(type===q.type);
        if(correct){score++;streak++;bestStreak=Math.max(streak,bestStreak);}else{streak=0;}
        el('word').textContent=q.word;el('word').classList.add('done');
        el('feedback').textContent=correct?`✅ Brawo! ${q.word}`:`❌ Prawidłowo: ${q.word} (${q.type.toUpperCase()})`;
        el('feedback').className=`feedback ${correct?'correct':'wrong'}`;
        el('score').textContent=`✓ ${score} poprawnych`;
        el('streak').textContent=`🔥 Seria: ${streak}`;
        el('choose-z').disabled=true;el('choose-rz').disabled=true;
        el('choices').classList.add('hidden');
        el('progress').setAttribute('aria-valuenow',index+1);
        el('progress-fill').style.width=`${(index+1)/round.length*100}%`;
        const next=el('next');next.textContent=index===round.length-1?'Zobacz wynik →':'Następne słowo →';next.classList.remove('hidden');next.focus({preventScroll:true});
      }
      function advance(){
        if(!answered)return;
        if(index+1>=round.length){finish();}else{index++;show();}
      }
      function finish(){
        el('game').classList.add('hidden');el('end').classList.remove('hidden');
        el('final-score').textContent=`${score}/${round.length}`;
        el('trophy').textContent=score===10?'🏆':score>=7?'🌟':'🌱';
        el('end-title').textContent=score===10?'Wszystko poprawnie!':score>=7?'Świetna robota!':'Dobra próba!';
        el('end-message').textContent=score===10?'Znasz wszystkie słowa z tej rundy!':score>=7?'Coraz lepiej znasz pisownię ż i rz.':'Ćwiczenie czyni mistrza. W nowej rundzie spróbuj ponownie!';
        el('restart').focus({preventScroll:true});
      }
      el('choose-z').addEventListener('click',()=>choose('ż'));
      el('choose-rz').addEventListener('click',()=>choose('rz'));
      el('next').addEventListener('click',advance);
      el('restart').addEventListener('click',start);
      document.addEventListener('keydown',(event)=>{
        if(event.altKey||event.ctrlKey||event.metaKey||event.repeat)return;
        if(el('end').classList.contains('hidden')){
          if(!answered&&event.key==='ArrowLeft'){event.preventDefault();choose('ż');}
          else if(!answered&&event.key==='ArrowRight'){event.preventDefault();choose('rz');}
          else if(answered&&(event.key==='Enter'||event.key===' ')){event.preventDefault();advance();}
        }else if(event.key==='Enter'||event.key===' '){event.preventDefault();start();}
      });
      start();
    })();
  </script>
</body>
</html>
